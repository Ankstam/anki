<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>白露 · 极速日语卡片</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide 图标库 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 极致纯净白色基调与平滑动画 */
    :root {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #F8F9FA;
      touch-action: pan-y;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    /* 禁用触摸默认拖曳 */
    .touch-card {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* 优雅超薄阴影 */
    .pure-card-shadow {
      box-shadow: 0 18px 45px -10px rgba(0, 0, 0, 0.05), 0 0 1px 1px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>
<body class="min-h-screen text-slate-700 flex flex-col justify-between overflow-hidden">

  <!-- 顶部轻盈进度显示 -->
  <header class="w-full pt-4 pb-2 px-6 flex items-center justify-between z-10">
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 rounded-full bg-pink-300 animate-pulse"></div>
      <span id="deckNameDisplay" class="text-xs font-medium text-slate-400 tracking-wider">加载中...</span>
    </div>
    <div class="text-xs font-semibold text-slate-400 bg-white/70 backdrop-blur px-2.5 py-1 rounded-full border border-slate-100 shadow-sm">
      <span id="progressCurrent">0</span> / <span id="progressTotal">0</span>
    </div>
  </header>

  <!-- 正中卡片核心区域 -->
  <main class="flex-1 flex flex-col items-center justify-center p-5 relative select-none w-full max-w-sm mx-auto">
    
    <!-- 卡片拖拽容器 -->
    <div id="cardWrapper" class="w-full aspect-[3/4] max-h-[460px] relative perspective-1000 touch-card cursor-grab active:cursor-grabbing">
      
      <!-- 划动状态徽标 -->
      <div id="badgePass" class="absolute top-6 left-6 z-30 opacity-0 pointer-events-none transform -rotate-12 border-2 border-emerald-400 bg-emerald-50/90 text-emerald-600 px-3 py-1 rounded-xl font-bold text-xs tracking-wider transition-opacity duration-150">
        已掌握 ✓
      </div>
      <div id="badgeFail" class="absolute top-6 right-6 z-30 opacity-0 pointer-events-none transform rotate-12 border-2 border-pink-400 bg-pink-50/90 text-pink-600 px-3 py-1 rounded-xl font-bold text-xs tracking-wider transition-opacity duration-150">
        再练练 ↺
      </div>

      <!-- 3D 翻转卡片实体 -->
      <div id="cardInner" class="w-full h-full relative transform-style-3d transition-transform duration-300 rounded-[2.2rem] bg-white pure-card-shadow border border-slate-100/80">
        
        <!-- 正面：纯白极简，看字速读 -->
        <div class="absolute inset-0 backface-hidden rounded-[2.2rem] bg-white p-8 flex flex-col items-center justify-between text-center overflow-hidden">
          <div class="w-full flex justify-between items-center text-[11px] text-slate-300 font-medium tracking-widest uppercase">
            <span>即刻朗读</span>
            <span class="flex items-center gap-1"><i data-lucide="sparkles" class="w-3 h-3 text-pink-300"></i> 单纯纯粹</span>
          </div>

          <div class="my-auto px-2">
            <h1 id="cardFrontText" class="text-4xl sm:text-5xl font-light text-slate-800 tracking-tight leading-snug">
              ...
            </h1>
          </div>

          <div class="flex flex-col items-center gap-1.5 text-slate-300 text-[11px]">
            <div class="flex items-center gap-1">
              <i data-lucide="hand" class="w-3.5 h-3.5 opacity-70"></i>
              <span>左划生疏 · 右划掌握 · 点击翻面</span>
            </div>
          </div>
        </div>

        <!-- 背面：答案、罗马音与自动音频核对 -->
        <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-[2.2rem] bg-gradient-to-b from-white via-white to-pink-50/20 p-8 flex flex-col items-center justify-between text-center border-2 border-pink-100">
          <div class="w-full flex justify-between items-center">
            <span class="text-[11px] font-semibold text-pink-400 tracking-wider">正确答案</span>
            <!-- 重新播音按钮 -->
            <button id="btnReplayAudio" class="p-2 rounded-full hover:bg-pink-50 text-pink-400 active:scale-90 transition">
              <i data-lucide="volume-2" class="w-5 h-5"></i>
            </button>
          </div>

          <div class="my-auto space-y-3 px-2">
            <div id="cardBackFurigana" class="text-2xl sm:text-3xl font-normal text-pink-500 tracking-wider">
              ...
            </div>
            <div id="cardBackMeaning" class="text-lg font-light text-slate-600">
              ...
            </div>
          </div>

          <div class="text-[11px] text-slate-400">
            发音正确向右轻划，生疏向左轻划
          </div>
        </div>

      </div>
    </div>

    <!-- 底部手势引导小光条 -->
    <div class="flex items-center justify-center gap-8 mt-4 text-[11px] text-slate-300 select-none">
      <span class="flex items-center gap-1 text-slate-400"><i data-lucide="arrow-left" class="w-3 h-3"></i> 重新学习</span>
      <span class="w-1 h-1 rounded-full bg-slate-200"></span>
      <span class="flex items-center gap-1 text-slate-400">掌握切出 <i data-lucide="arrow-right" class="w-3 h-3"></i></span>
    </div>

  </main>

  <!-- 底部悬浮极简功能栏 -->
  <footer class="w-full pb-8 pt-2 flex items-center justify-center z-10">
    <div class="bg-white/90 backdrop-blur-md px-5 py-2.5 rounded-full pure-card-shadow border border-slate-100 flex items-center gap-5">
      
      <!-- 重新发音 -->
      <button id="btnQuickAudio" class="text-slate-400 hover:text-pink-400 active:scale-90 transition flex items-center gap-1 text-xs font-medium" title="朗读当前词">
        <i data-lucide="volume-2" class="w-4 h-4"></i>
        <span>读音</span>
      </button>

      <div class="w-px h-3 bg-slate-200"></div>

      <!-- 翻面 -->
      <button id="btnManualFlip" class="text-slate-400 hover:text-slate-600 active:scale-90 transition flex items-center gap-1 text-xs font-medium">
        <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        <span>翻面</span>
      </button>

      <div class="w-px h-3 bg-slate-200"></div>

      <!-- 设置与管理 -->
      <button id="btnOpenSettings" class="text-slate-500 hover:text-slate-800 active:scale-90 transition flex items-center gap-1 text-xs font-medium">
        <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
        <span>设置 & 词库</span>
      </button>

    </div>
  </footer>

  <!-- 设置与词库管理抽屉（从底部滑出，契合移动端） -->
  <div id="settingsDrawer" class="fixed inset-x-0 bottom-0 max-h-[85vh] bg-white rounded-t-[2.5rem] shadow-2xl z-50 transform translate-y-full transition-transform duration-300 flex flex-col border-t border-slate-100">
    <!-- 顶部拖曳把手 -->
    <div class="w-full py-3 flex items-center justify-center cursor-pointer" id="drawerHandle">
      <div class="w-10 h-1 bg-slate-200 rounded-full"></div>
    </div>

    <div class="px-6 pb-6 overflow-y-auto flex-1 space-y-6">
      
      <!-- 标题 -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <h2 class="text-base font-semibold text-slate-800">牌组与设置</h2>
          <p class="text-xs text-slate-400">本地离线存储，数据永不丢失</p>
        </div>
        <button id="btnCloseSettings" class="p-2 text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 发音源测试与开关 -->
      <div class="bg-slate-50 p-4 rounded-2xl space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-slate-700">发音测试</span>
          <button id="btnTestAudio" class="px-3 py-1 bg-white border border-slate-200 text-xs font-medium rounded-full text-pink-500 active:scale-95 transition shadow-sm">
            点击试听「こんにちは」
          </button>
        </div>
        <p class="text-[11px] text-slate-400">已默认开启高保真真人原声（有道日语音频 + WebSpeech 双重容灾，手机无论何种系统必出声音）。</p>
      </div>

      <!-- 牌组切换与管理 -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">选择牌组</label>
          <button id="btnCreateDeckPrompt" class="text-xs text-pink-500 font-medium hover:underline flex items-center gap-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新建牌组
          </button>
        </div>
        <select id="deckSelectDropdown" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-xl p-3 text-slate-700 focus:outline-none focus:border-pink-300"></select>
      </div>

      <!-- 批量导入快捷入口 -->
      <div class="space-y-3">
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider block">符号批量导入</label>
        <div class="flex gap-2">
          <input type="text" id="importCustomSeparator" value="\t" placeholder="分隔符 (默认Tab制表符)" class="w-1/3 bg-slate-50 border border-slate-200 text-xs rounded-xl p-2.5 text-center text-slate-700 focus:outline-none">
          <button id="btnTriggerFastImport" class="flex-1 bg-slate-900 text-white rounded-xl text-xs font-medium py-2.5 active:scale-95 transition">
            从剪贴板格式文本导入
          </button>
        </div>
        <textarea id="importTextInput" rows="3" placeholder="会社&#9;かいしゃ&#9;公司&#10;約束&#9;やくそく&#9;约定" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl p-3 text-slate-700 focus:outline-none font-mono"></textarea>
      </div>

      <!-- 卡片条目目录 -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-500">
          <span>当前牌组卡片目录 (<span id="drawerCardTotal">0</span>)</span>
          <button id="btnExportJsonData" class="text-pink-500 hover:underline">备份导出</button>
        </div>
        <div id="drawerCardItems" class="max-h-48 overflow-y-auto space-y-1.5 pr-1"></div>
      </div>

    </div>
  </div>
  <div id="settingsOverlay" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 hidden"></div>

  <!-- 核心逻辑 -->
  <script>
    // --- 1. IndexedDB 本地持久化 ---
    const DB_NAME = 'PureJapaneseCardsDB';
    let db;

    function initDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('decks')) d.createObjectStore('decks', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('cards')) {
            const cardStore = d.createObjectStore('cards', { keyPath: 'id' });
            cardStore.createIndex('deckId', 'deckId', { unique: false });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = reject;
      });
    }

    const storage = {
      async getDecks() {
        return new Promise(res => {
          const req = db.transaction('decks', 'readonly').objectStore('decks').getAll();
          req.onsuccess = () => res(req.result || []);
        });
      },
      async saveDeck(deck) {
        return new Promise(res => {
          const tx = db.transaction('decks', 'readwrite');
          tx.objectStore('decks').put(deck);
          tx.oncomplete = () => res();
        });
      },
      async getCards(deckId) {
        return new Promise(res => {
          const index = db.transaction('cards', 'readonly').objectStore('cards').index('deckId');
          const req = index.getAll(IDBKeyRange.only(deckId));
          req.onsuccess = () => res(req.result || []);
        });
      },
      async addCards(cards) {
        return new Promise(res => {
          const tx = db.transaction('cards', 'readwrite');
          const s = tx.objectStore('cards');
          cards.forEach(c => s.put(c));
          tx.oncomplete = () => res();
        });
      },
      async deleteCard(id) {
        return new Promise(res => {
          const tx = db.transaction('cards', 'readwrite');
          tx.objectStore('cards').delete(id);
          tx.oncomplete = () => res();
        });
      }
    };

    // --- 2. 强力双引擎音频播放器 (彻底解决手机无声) ---
    let audioUnlockAttempted = false;

    // 用户首次触摸解锁移动端音频限制
    function tryUnlockAudio() {
      if (audioUnlockAttempted) return;
      audioUnlockAttempted = true;
      const silentAudio = new Audio('data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//OEAAAAAAAAAAAAAAAAAAAAAAA=');
      silentAudio.play().catch(() => {});
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(u);
      }
    }
    window.addEventListener('touchstart', tryUnlockAudio, { once: true });
    window.addEventListener('click', tryUnlockAudio, { once: true });

    function playJapaneseVoice(text) {
      if (!text) return;
      tryUnlockAudio();

      // 方案 A: 有道高保真原声 MP3（手机端 100% 稳定，无需本地日语语音引擎）
      const youdaoUrl = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&le=jap`;
      const audio = new Audio(youdaoUrl);
      
      let played = false;
      audio.play().then(() => {
        played = true;
      }).catch(err => {
        // 方案 B: 降级到 Web Speech API
        if (!played && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const ut = new SpeechSynthesisUtterance(text);
          ut.lang = 'ja-JP';
          ut.rate = 1.0;
          window.speechSynthesis.speak(ut);
        }
      });
    }

    // --- 3. 初始示范数据 ---
    const SEED_DECK = { id: 'deck_daily_core', name: '常用日语 · 每日一刷' };
    const SEED_CARDS = [
      { id: 'c1', deckId: 'deck_daily_core', front: '花', furigana: 'はな', meaning: '花朵' },
      { id: 'c2', deckId: 'deck_daily_core', front: '桜', furigana: 'さくら', meaning: '樱花' },
      { id: 'c3', deckId: 'deck_daily_core', front: '光', furigana: 'ひかり', meaning: '光芒' },
      { id: 'c4', deckId: 'deck_daily_core', front: '約束', furigana: 'やくそく', meaning: '约定' },
      { id: 'c5', deckId: 'deck_daily_core', front: '青空', furigana: 'あおぞら', meaning: '晴空 / 蔚蓝的天空' },
      { id: 'c6', deckId: 'deck_daily_core', front: '綺麗', furigana: 'きれい', meaning: '美丽 / 干净' },
      { id: 'c7', deckId: 'deck_daily_core', front: '純粋', furigana: 'じゅんすい', meaning: '纯粹 / 纯洁' }
    ];

    // --- 4. 核心状态 ---
    let currentDeckId = 'deck_daily_core';
    let cards = [];
    let activeCardIndex = 0;
    let isCardFlipped = false;

    const elCardWrapper = document.getElementById('cardWrapper');
    const elCardInner = document.getElementById('cardInner');
    const elFront = document.getElementById('cardFrontText');
    const elBackFuri = document.getElementById('cardBackFurigana');
    const elBackMean = document.getElementById('cardBackMeaning');
    const elProgCur = document.getElementById('progressCurrent');
    const elProgTot = document.getElementById('progressTotal');
    const elDeckTitle = document.getElementById('deckNameDisplay');
    const elBadgePass = document.getElementById('badgePass');
    const elBadgeFail = document.getElementById('badgeFail');

    function renderActiveCard() {
      resetCardPosition();
      setFlip(false, false);

      if (cards.length === 0) {
        elFront.innerText = '清空了 ✨';
        elBackFuri.innerText = '全部复习完毕';
        elBackMean.innerText = '点击下方设置导入新卡片';
        elProgCur.innerText = '0';
        elProgTot.innerText = '0';
        return;
      }

      if (activeCardIndex >= cards.length) activeCardIndex = 0;
      const card = cards[activeCardIndex];

      elFront.innerText = card.front;
      elBackFuri.innerText = card.furigana || card.front;
      elBackMean.innerText = card.meaning || '';

      elProgCur.innerText = activeCardIndex + 1;
      elProgTot.innerText = cards.length;
    }

    function setFlip(flipped, autoPlay = true) {
      isCardFlipped = flipped;
      if (isCardFlipped) {
        elCardInner.classList.add('rotate-y-180');
        if (autoPlay && cards[activeCardIndex]) {
          playJapaneseVoice(cards[activeCardIndex].front);
        }
      } else {
        elCardInner.classList.remove('rotate-y-180');
      }
    }

    function toggleCardFlip() {
      if (cards.length === 0) return;
      setFlip(!isCardFlipped, true);
    }

    // --- 5. 手机端物理滑动交互 (Touch Gestures) ---
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let isDragging = false;
    let hasMoved = false;

    function handleTouchStart(e) {
      if (cards.length === 0) return;
      const point = e.touches ? e.touches[0] : e;
      startX = point.clientX;
      startY = point.clientY;
      currentX = 0;
      isDragging = true;
      hasMoved = false;
      elCardInner.style.transition = 'none';
    }

    function handleTouchMove(e) {
      if (!isDragging) return;
      const point = e.touches ? e.touches[0] : e;
      const deltaX = point.clientX - startX;
      const deltaY = point.clientY - startY;

      if (Math.abs(deltaX) > 6 || Math.abs(deltaY) > 6) {
        hasMoved = true;
      }

      currentX = deltaX;
      const rotate = deltaX * 0.08;
      
      // 保持当前是否翻面状态下的位移
      const flipTransform = isCardFlipped ? 'rotateY(180deg) ' : '';
      elCardInner.style.transform = `translate3d(${deltaX}px, ${deltaY * 0.3}px, 0) rotate(${rotate}deg) ${flipTransform}`;

      // 滑动反馈微标提示
      if (deltaX > 25) {
        elBadgePass.style.opacity = Math.min((deltaX - 25) / 60, 1);
        elBadgeFail.style.opacity = 0;
      } else if (deltaX < -25) {
        elBadgeFail.style.opacity = Math.min((-deltaX - 25) / 60, 1);
        elBadgePass.style.opacity = 0;
      } else {
        elBadgePass.style.opacity = 0;
        elBadgeFail.style.opacity = 0;
      }
    }

    function handleTouchEnd() {
      if (!isDragging) return;
      isDragging = false;
      elBadgePass.style.opacity = 0;
      elBadgeFail.style.opacity = 0;

      // 如果几乎没位移，视作点击 ➔ 翻面
      if (!hasMoved) {
        toggleCardFlip();
        resetCardPosition();
        return;
      }

      const SWIPE_THRESHOLD = 80;

      if (currentX > SWIPE_THRESHOLD) {
        // 右划：掌握 (卡片向右飞出)
        swipeOut(1);
      } else if (currentX < -SWIPE_THRESHOLD) {
        // 左划：生疏 (卡片向左飞出并插回队伍)
        swipeOut(-1);
      } else {
        // 回弹
        resetCardPosition();
      }
    }

    function resetCardPosition() {
      elCardInner.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      const flipTransform = isCardFlipped ? 'rotateY(180deg)' : '';
      elCardInner.style.transform = `translate3d(0, 0, 0) rotate(0deg) ${flipTransform}`;
    }

    function swipeOut(direction) {
      elCardInner.style.transition = 'transform 0.3s ease-out, opacity 0.25s ease-out';
      const flyX = direction * 500;
      const flipTransform = isCardFlipped ? 'rotateY(180deg)' : '';
      elCardInner.style.transform = `translate3d(${flyX}px, 0, 0) rotate(${direction * 30}deg) ${flipTransform}`;
      elCardInner.style.opacity = '0';

      setTimeout(() => {
        if (direction === 1) {
          // 掌握：移出
          cards.splice(activeCardIndex, 1);
        } else {
          // 生疏：插回队伍后方第 3 张
          const [failed] = cards.splice(activeCardIndex, 1);
          const insertPos = Math.min(activeCardIndex + 2, cards.length);
          cards.splice(insertPos, 0, failed);
        }
        elCardInner.style.opacity = '1';
        renderActiveCard();
      }, 250);
    }

    // 绑定卡片手势
    elCardWrapper.addEventListener('touchstart', handleTouchStart, { passive: true });
    window.addEventListener('touchmove', handleTouchMove, { passive: true });
    window.addEventListener('touchend', handleTouchEnd);

    elCardWrapper.addEventListener('mousedown', handleTouchStart);
    window.addEventListener('mousemove', handleTouchMove);
        window.addEventListener('mouseup', handleTouchEnd);

    // --- 6. 底部工具栏与按钮 ---
    document.getElementById('btnManualFlip').onclick = toggleCardFlip;
    document.getElementById('btnQuickAudio').onclick = () => {
      if (cards[activeCardIndex]) playJapaneseVoice(cards[activeCardIndex].front);
    };
    document.getElementById('btnReplayAudio').onclick = (e) => {
      e.stopPropagation();
      if (cards[activeCardIndex]) playJapaneseVoice(cards[activeCardIndex].front);
    };
    document.getElementById('btnTestAudio').onclick = () => {
      playJapaneseVoice('こんにちは');
    };

    // --- 7. 抽屉与设置管理 ---
    const drawer = document.getElementById('settingsDrawer');
    const overlay = document.getElementById('settingsOverlay');
    const openDrawer = () => {
      refreshDrawerData();
      drawer.classList.remove('translate-y-full');
      overlay.classList.remove('hidden');
    };
    const closeDrawer = () => {
      drawer.classList.add('translate-y-full');
      overlay.classList.add('hidden');
    };
    document.getElementById('btnOpenSettings').onclick = openDrawer;
    document.getElementById('btnCloseSettings').onclick = closeDrawer;
    document.getElementById('drawerHandle').onclick = closeDrawer;
    overlay.onclick = closeDrawer;

    async function loadDeck(deckId) {
      currentDeckId = deckId;
      const allDecks = await storage.getDecks();
      const cur = allDecks.find(d => d.id === deckId);
      elDeckTitle.innerText = cur ? cur.name : '词库';

      const list = await storage.getCards(deckId);
      cards = [...list].sort(() => Math.random() - 0.5);
      activeCardIndex = 0;
      renderActiveCard();
    }

    async function refreshDrawerData() {
      const decks = await storage.getDecks();
      const select = document.getElementById('deckSelectDropdown');
      select.innerHTML = '';
      decks.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name;
        if (d.id === currentDeckId) opt.selected = true;
        select.appendChild(opt);
      });

      const cardList = await storage.getCards(currentDeckId);
      document.getElementById('drawerCardTotal').innerText = cardList.length;
      const listContainer = document.getElementById('drawerCardItems');
      listContainer.innerHTML = '';

      cardList.forEach(c => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2.5 bg-slate-50 rounded-xl text-xs';
        item.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${c.front}</span>
            <span class="text-pink-400 ml-1.5">${c.furigana || ''}</span>
            <span class="text-slate-400 ml-1">· ${c.meaning || ''}</span>
          </div>
          <button data-id="${c.id}" class="btn-del p-1 text-slate-300 hover:text-pink-500">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;
        listContainer.appendChild(item);
      });
      lucide.createIcons();

      listContainer.querySelectorAll('.btn-del').forEach(btn => {
        btn.onclick = async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          await storage.deleteCard(id);
          await loadDeck(currentDeckId);
          refreshDrawerData();
        };
      });
    }

    document.getElementById('deckSelectDropdown').onchange = (e) => {
      loadDeck(e.target.value);
    };

    document.getElementById('btnCreateDeckPrompt').onclick = async () => {
      const name = prompt('请输入新牌组名称：');
      if (name && name.trim()) {
        const newId = 'deck_' + Date.now();
        await storage.saveDeck({ id: newId, name: name.trim() });
        await loadDeck(newId);
        refreshDrawerData();
      }
    };

    // 格式化快速导入
    document.getElementById('btnTriggerFastImport').onclick = async () => {
      const text = document.getElementById('importTextInput').value.trim();
      if (!text) {
        alert('请在文本框输入要导入的词汇');
        return;
      }
      let rawSep = document.getElementById('importCustomSeparator').value;
      let sep = rawSep === '\\t' ? '\t' : (rawSep || '\t');

      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      const batch = [];
      lines.forEach((line, idx) => {
        const parts = line.split(sep).map(p => p.trim());
        if (parts.length >= 2) {
          batch.push({
            id: 'c_' + Date.now() + '_' + idx,
            deckId: currentDeckId,
            front: parts[0],
            furigana: parts[1],
            meaning: parts.slice(2).join(' ') || ''
          });
        }
      });

      if (batch.length === 0) {
        alert('无法匹配当前分隔符，请核对文本格式');
        return;
      }

      await storage.addCards(batch);
      document.getElementById('importTextInput').value = '';
      await loadDeck(currentDeckId);
      refreshDrawerData();
      alert(`已成功导入 ${batch.length} 张卡片！`);
    };

    // 导出备份
    document.getElementById('btnExportJsonData').onclick = async () => {
      const list = await storage.getCards(currentDeckId);
      const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `deck_${currentDeckId}.json`;
      a.click();
    };

    // 键盘支持 (桌面测试便利)
    window.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.code === 'Space') {
        e.preventDefault();
        toggleCardFlip();
      } else if (e.code === 'ArrowRight') {
        swipeOut(1);
      } else if (e.code === 'ArrowLeft') {
        swipeOut(-1);
      }
    });

    // --- 8. 启动初始化 ---
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await initDatabase();

      const existingDecks = await storage.getDecks();
      if (existingDecks.length === 0) {
        await storage.saveDeck(SEED_DECK);
        await storage.addCards(SEED_CARDS);
        currentDeckId = SEED_DECK.id;
      } else {
        currentDeckId = existingDecks[0].id;
      }

      await loadDeck(currentDeckId);
    });
  </script>
</body>
</html>
